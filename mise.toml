[tools]
bun = "1.3.14"

[env]
PORT = "3001"

[tasks.install]
description = "Install monorepo dependencies"
run = "bun install"

[tasks.dev]
description = "Run API server and web UI"
run = "bun run dev"

[tasks."dev:server"]
description = "Run Express API on Bun"
run = "bun run dev:server"

[tasks."dev:web"]
description = "Run Vite web UI"
run = "bun run dev:web"

[tasks.build]
description = "Build all packages"
run = "bun run build"

[tasks.test]
description = "Run tests"
run = "bun run test"

[tasks.lint]
description = "Lint all packages"
run = "bun run lint"

[tasks.typecheck]
description = "Typecheck all packages"
run = "bun run typecheck"
